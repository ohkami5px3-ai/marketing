<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>マーケティング2級 Premium</title>
<style>
    /* ▼▼▼ ここで推しのイメージカラーを設定できます ▼▼▼ */
    :root { 
        --primary: #ff4081; /* ピンク系 */
        --correct: #16a34a; 
        --wrong: #dc2626; 
        --bg: #f3f4f6; 
        --card: rgba(255, 255, 255, 0.95); 
    }
    
    body { 
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
        background-color: var(--bg); 
        background-size: cover; 
        background-position: center;
        background-attachment: fixed;
        color: #1f2937; margin: 0; padding: 0; 
        display: flex; flex-direction: column; align-items: center; justify-content: center; 
        min-height: 100vh; 
        -webkit-tap-highlight-color: transparent; 
    }
    body::before {
        content: ""; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.4); /* 背景の暗さ調整 */
        z-index: -1;
    }

    .container { width: 100%; max-width: 600px; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; height: 100vh; justify-content: center; }
    
    .card { background: var(--card); border-radius: 20px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2); padding: 24px; display: flex; flex-direction: column; max-height: 90vh; overflow-y: auto; backdrop-filter: blur(5px); }
    
    .title-screen { text-align: center; }
    .title-screen h1 { font-size: 1.8rem; margin-bottom: 0.5rem; color: var(--primary); text-shadow: 1px 1px 0 #fff; }
    
    /* 画像エリア共通設定 */
    .idol-image-area {
        width: 100%; height: 200px; 
        background-size: cover; background-position: center; 
        border-radius: 12px; margin-bottom: 20px;
        display: none; 
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        transition: transform 0.3s ease;
    }
    .idol-image-area.show { display: block; animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

    .quiz-header { display: flex; justify-content: space-between; margin-bottom: 16px; font-size: 0.9rem; color: #6b7280; font-weight: bold; }
    .question-text { font-size: 1.1rem; font-weight: 600; margin-bottom: 24px; line-height: 1.6; white-space: pre-wrap; }
    
    .options-grid { display: grid; gap: 12px; }
    .option-btn { background: #fff; border: 2px solid #e5e7eb; padding: 16px; border-radius: 12px; font-size: 1rem; text-align: left; cursor: pointer; transition: all 0.2s; color: #374151; font-weight: 500; }
    .option-btn:active { transform: scale(0.98); }
    .option-btn.correct { background: #dcfce7; border-color: var(--correct); color: var(--correct); font-weight: bold; }
    .option-btn.wrong { background: #fee2e2; border-color: var(--wrong); color: var(--wrong); opacity: 0.7; }
    .option-btn.disabled { pointer-events: none; }

    .explanation-area { margin-top: 24px; padding: 16px; background: rgba(239, 246, 255, 0.8); border-radius: 12px; border-left: 5px solid var(--primary); display: none; animation: fadeIn 0.3s; }
    .btn-primary { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 50px; font-size: 1.1rem; font-weight: bold; width: 100%; margin-top: 20px; cursor: pointer; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.2); transition: transform 0.1s; }
    .btn-primary:active { transform: scale(0.95); }
    .btn-start { display: block; }
    
    .result-screen { text-align: center; display: none; }
    .score-circle { width: 120px; height: 120px; background: var(--primary); color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; font-weight: bold; margin: 0 auto 24px; border: 4px solid white; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    .rank-text { font-size: 1.5rem; font-weight: bold; color: var(--primary); margin-bottom: 10px; display: block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes popIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }

    /* --- 10問達成ご褒美モーダルのスタイル --- */
    .reward-modal {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.8);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
    }

    .reward-content {
        background: #fff;
        padding: 20px;
        border-radius: 15px;
        text-align: center;
        width: 90%;
        max-width: 400px;
        box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        animation: popIn 0.5s ease;
    }

    .reward-content h2 {
        color: #ff6b6b;
        margin-bottom: 15px;
    }

    .reward-content img {
        width: 100%;
        height: auto;
        border-radius: 10px;
        margin-bottom: 15px;
    }

    .reward-content button {
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="container">
    <div id="start-screen" class="card title-screen">
        <h1>マーケティング2級<br></h1>
        <div id="start-image" class="idol-image-area show" style="height: 250px;"></div>
        <p>今日も一緒に頑張りましょう！</p>
        <button class="btn-primary btn-start" onclick="startQuiz()">勉強を始める</button>
    </div>

    <div id="quiz-screen" class="card" style="display: none;">
        <div class="quiz-header">
            <span id="progress-text">Q1</span>
            <span id="score-text">Score: 0</span>
        </div>

        <div id="reaction-image" class="idol-image-area"></div>

        <div id="question-text" class="question-text"></div>
        <div id="options-container" class="options-grid"></div>
        
        <div id="explanation" class="explanation-area">
            <span id="result-status" style="font-weight:bold; display:block; margin-bottom:5px;"></span>
            <div id="explanation-content" style="font-size:0.95rem;"></div>
        </div>

        <button id="next-btn" class="btn-primary" onclick="nextQuestion()">次の問題へ</button>
    </div>

    <div id="result-screen" class="card result-screen">
        <span id="rank-title" class="rank-text"></span>
        <div id="result-image" class="idol-image-area show" style="height: 220px; margin-bottom: 20px;"></div>
        <div class="score-circle">
            <span id="final-score"></span>
        </div>
        <p id="feedback-message" style="font-weight: bold; color: #4b5563;"></p>
        <button class="btn-primary btn-start" onclick="startQuiz()">もう一回！</button>
    </div>
</div>

<div id="reward-modal" class="reward-modal" style="display: none;">
    <div class="reward-content">
        <h2>🎉 10問達成！お疲れ様！ 🎉</h2>
        <img id="reward-img" src="" alt="ご褒美画像">
        <button onclick="closeReward()">次の問題へ進む</button>
    </div>
</div>
    
<script>
    // ★★★ 推し設定エリア ★★★
    const idolConfig = {
        background: "https://ogre.natalie.mu/media/news/music/2026/0102/SnowMan_art202601.jpg?imwidth=1460&imdensity=1&impolicy=hq",
        start: "https://ogre.natalie.mu/media/news/music/2026/0325/zoff_meguro0325_2.jpg?imwidth=1460&imdensity=1&impolicy=hq",
        
        // 結果発表の画像（5段階）
        result: {
            rank5: "https://高画質ジャケット画像.com/blog/wp-content/uploads/2023/12/JWCD-63800.jpg",
            rank4: "https://高画質ジャケット画像.com/blog/wp-content/uploads/2019/12/snow-man.jpg",
            rank3: "https://stat.ameba.jp/user_images/20221130/13/blue1130v6/29/23/p/o1080038615210130880.png?caw=800",
            rank2: "https://stat.ameba.jp/user_images/20221130/13/blue1130v6/e5/8e/p/o1080045815210130908.png?caw=800",
            rank1: "https://stat.ameba.jp/user_images/20221130/13/blue1130v6/74/89/p/o0845025315210130918.png?caw=800"
        }
    };
    
    // 背景設定
    document.body.style.backgroundImage = `url('${idolConfig.background}')`;
    document.getElementById('start-image').style.backgroundImage = `url('${idolConfig.start}')`;

    // ▼▼▼ 問題データ（ここに問題を追加してください） ▼▼▼
    const allQuestions = [
  {
            q: `【問題1 戦略の構成要素】
企業が開発する戦略に含まれるべき要素とその説明の組合せとして適切なものは、次のうちどれか。

1. 資源の展開：企業が参入しようとしている産業、製品ライン、市場セグメントの数と種類。
2. 目的と目標：戦略を達成する水準には、売上高の成長や利益が含まれる。
3. 範囲：企業が戦略を策定する際には、経営資源をどのように調達、配分するかを検討する必要がある。
4. シナジー：企業戦略においては、競争の方法を示す必要が出てくる。
5. 持続可能な競争優位の明確化：各事業や製品市場、あるいは資源や能力が互いに補強する場合に生み出される成果。`,
        a: "2",
        exp: "正解は「2」です。\n\n【解説】\n◯ 2：目的と目標（KPI設定）に関する正しい記述です。システムのSLA（サービス品質保証）やパフォーマンス要件を定義するフェーズに該当します [cite: 348]。\n✕ 1：記述は「範囲（事業ドメイン：Scope）」です [cite: 346]。\n✕ 3：記述は「資源の展開（リソース割り当て：Resource Deployment）」です。プロセスのメモリアロケーションの概念に似ています [cite: 349]。\n✕ 4：記述は「競争優位性（どう勝つか）」のアルゴリズムです [cite: 350]。\n✕ 5：記述は「シナジー（相乗効果）」です。複数モジュール連携による総合的なパフォーマンス向上を指します [cite: 350, 351]。"
    },
    {
        q: `【問題3 ターゲティングの有効性】
ターゲティングがマーケティング戦略の有効性を高める理由に関する記述として最も不適切なものは、次のうちどれか。

1. 市場需要の変化に適応していこうとする企業の能力の最大化を可能にするため。
2. 主要市場をカバーできる可能性を高めるため。
3. マーケティング資源の適切な配分を可能にするため。
4. 自社及び競合企業の強い点と弱い点というポジショニングの正確な評価が可能なため。
5. 適切なマーケティング機会の発見及び正確なマーケティング目標の設定を可能にするため。`,
        a: "2",
        exp: "正解は「2」です（これが不適切）。\n\n【解説】\nターゲティング（標的市場の選定）の目的は、限られた経営資源（CPUやメモリ）を特定のセグメントに集中投下し、処理効率を最適化することです。「市場全体（全てのユースケース）をカバーする」というアプローチ（マス・マーケティング）は、リソースの分散（メモリリークやパフォーマンス低下）を招くアンチパターンであり、ターゲティングの設計思想（カプセル化やスコープの限定）と完全に矛盾します [cite: 358, 360]。"
    },
    {
        q: `【問題4 ポジショニングの条件】
ポジショニングの有効性を高める条件に関する記述として不適切なものは、次のうちどれか。

1. ポジショニングを行う際の属性軸は、ターゲット顧客にとって重要なものでなければならない。
2. 主要なターゲット市場に関するポジショニングをできる限り多面的に理解しておく必要がある。
3. 市場・顧客ニーズの観点からポジショニングによって市場に提供する価格の要素を明確にする必要がある。
4. ポジショニングに織り込まれるベネフィットは、ターゲット顧客に魅力あるものでなければならない。
5. 選定された市場ポジションは、ターゲット顧客にとって理解しやすく、容易に伝達できることが必要である。`,
        a: "2",
        exp: "正解は「2」です（これが不適切）。\n\n【解説】\nポジショニングは、顧客の脳内に自社の明確な立ち位置（変数の値）を定義するプロセスです。そのため「多面的（複雑な多次元配列）」にアピールしようとすると、メッセージがぼやけて顧客の認知エラー（コンフリクト）を引き起こします。インターフェースはシンプルに「1つか2つの強力な軸（単一責任原則・KISS原則）」に絞り込むのが優れた設計です [cite: 366, 368]。"
    },
    {
        q: `【問題5 MIS（マーケティング情報システム）】
MIS（マーケティング情報システム）に関する記述として不適切なものは、次のうちどれか。

1. MISで活用される情報は、全てマーケティング・リサーチで収集される。
2. MISの支援により、取引業者や顧客との関係を強化し、競争優位を実現することが可能である。
3. 定型的なマーケティング意思決定は、MISにより自動化することも可能である。
4. マーケティング意思決定における仮説検証は、MISで支援することが可能である。
5. MISを利用して、差別化された製品・サービスを開発する場合がある。`,
        a: "1",
        exp: "正解は「1」です（これが不適切）。\n\n【解説】\nMISのデータソースは、意図的に実施する「マーケティング・リサーチ（外部APIからの取得）」だけではありません。日々の売上データや顧客データといった「内部記録（DBのトランザクションログ）」や、日常的な環境情報の収集（デーモンによる環境変数の常時モニタリング）など、多様なデータソースを統合して構築されるシステムです。「全てリサーチで」という排他的な制約条件は仕様の誤認（バグ）です [cite: 372, 373]。"
    },
    {
        q: `【問題8 インターネット・リサーチ】
インターネットを活用したマーケティング・データの収集に関する記述として不適切なものは、次のうちどれか。

1. インターネットを活用したデータ収集は、質問法ばかりでなく観察法にも見られるようになってきている。
2. IoTは、データをリアルタイムかつ正確に収集できる手法の1つである。
3. インターネットを活用した調査は全ての人を対象にできるので、あらゆる年齢層のデータ収集に適している。
4. Web上の検索履歴や閲覧行動のデータを活用した行動ターゲティング広告は、近年多く利用されている広告手法である。
5. 企業は、インターネットを通じたリサーチ活動が消費者のプライバシーを侵害する可能性に十分な注意と配慮をする必要がある。`,
        a: "3",
        exp: "正解は「3」です（これが不適切）。\n\n【解説】\nインターネット調査は「サンプリングバイアス（特定の属性への偏り）」という重大なバグを含みやすい手法です。全年齢層が均等にネットを使いこなしているわけではないため、「あらゆる年齢層に完璧に適している」とするのは仕様の誤認です。高齢者層のデータが欠損（Null）になりやすい点に注意し、エラーハンドリング（代替手法による補完）を検討する必要があります [cite: 403, 406]。"
    },
    {
        q: `【問題9 サンプリング手法】
単純無作為抽出法に関する記述として適切なものは、次のうちどれか。

1. 母集団の中から最初の調査対象者をランダムに選んで、後のサンプルは一定の抽出間隔を決めて選び出す方法である。
2. 母集団のサンプリング台帳からサンプルを1つずつランダムに抽出する方法である。
3. 調査者が性別、年齢、職業などの人口構成比率に応じて標本数を割り当てる方法である。
4. 母集団をあらかじめ等質なグループに分けておき、そのグループの大きさに比例してサンプルを抽出する方法である。
5. 標本抽出を何段階にもわたって行う方法で、母集団の数が多く、地域的にも広く散在する場合などに用いられる。`,
        a: "2",
        exp: "正解は「2」です。\n\n【解説】\n◯ 2：これが単純無作為抽出法です。乱数生成関数（`Math.random()`など）を使って、配列（母集団）から完全にランダムに要素をフェッチする最もピュアなアルゴリズムです [cite: 411, 413]。\n✕ 1：系統抽出法（一定間隔のループ処理） [cite: 412]。\n✕ 3：割当抽出法（属性ごとの定数・ハードコード設定） [cite: 413]。\n✕ 4：層化抽出法（グループ分けしてからの比例抽出） [cite: 414]。\n✕ 5：多段抽出法（階層的な絞り込み処理） [cite: 415]。"
    },
    {
        q: `【問題10 消費者の購買行動】
消費者の購買行動に関する記述として適切なものは、次のうちどれか。

1. 消費者は、外部情報の探索で十分な満足の決定が下せないとき、内部情報の探索を行う。
2. 複雑な購買者の心的プロセスを階層に分けて可視化したものが、AIDAモデルである。
3. 消費者の購買行動は、合理的な購買行動に限定される。
4. 消費者行動には購買行動と消費行動が含まれ、購買に至るプロセスだけではなく購入後の消費行動の研究も重要である。
5. 消費者購買意思決定プロセスの代替案の評価の段階で浮かんでくる「想起セット」は、通常、かなり多くのブランドが想起され考慮される。`,
        a: "4",
        exp: "正解は「4」です。\n\n【解説】\n◯ 4：消費者行動モデルにおいて、購買行動は「トランザクションの完了」で終わりではありません。その後の消費（利用体験）や廃棄に至るまでの「ライフサイクル全体（オブジェクトの生成から破棄・ガベージコレクションまで）」をトラッキングすることが、LTV（顧客生涯価値）向上の要件となります [cite: 416, 420]。\n✕ 1：順序が逆です。まずローカルキャッシュ（内部記憶）を検索し、ヒットしなければ外部API（外部情報）を叩きます [cite: 417]。\n✕ 5：思い浮かぶブランド（想起セット）は、人間のワーキングメモリの制約上、通常3〜5個程度に限定されます [cite: 421]。"
    },
    {
        q: `【問題12 新製品開発プロセス】
一般的な日用品の新製品開発のプロセスに関する記述として不適切なものは、次のうちどれか。

1. アイデア創出：社内・社外双方からアイデアを得る。
2. アイデア・スクリーニング：市場性、製造能力などの観点からアイデアをスクリーニングする。
3. 製品コンセプトの決定：製品アイデアの4W1Hを決定することで製品コンセプトとする。
4. 製品開発：選択されたコンセプトの試作品が作られ、実験室テストの結果により製品化が行われる。
5. 市場テスト：新製品の失敗リスクを減少させるためであり、短期間で情報が得られ、コストが安いことがメリットである。`,
        a: "5",
        exp: "正解は「5」です（これが不適切）。\n\n【解説】\n市場テスト（テストマーケティング）は、本番環境（プロダクション）の一部に限定して実際に製品をリリースする「カナリアリリース」や「A/Bテスト」のようなプロセスです。リアルなデータが取れる反面、「期間がかかる」「コスト（インフラ費用や運用費）が高い」「競合にコード（新製品のアイデア）をリバースエンジニアリングされるリスクがある」といった強烈なデメリット（トレードオフ）が存在します [cite: 431, 441, 442]。"
    },
    {
        q: `【問題14 小売業のFSP戦略】
小売業のFSP（フリークエント・ショッパーズ・プログラム）戦略として適切なものは、次のうちどれか。

1. 商品グレード別に価格を設定し、幅広い顧客グループに向けて商品をラインナップして提供する。
2. 一定の期間、意図的に特定の商品を大幅な値引き価格で提供する。
3. 上位の優良顧客を囲い込むために、認定した会員だけの特別価格などを提供する。
4. 特定の商品に対して、変動のない安い価格を設定し、提供し続ける。
5. ライバルの他店のチラシ持参により、他店よりも安い価格で同一商品を提供する。`,
        a: "3",
        exp: "正解は「3」です。\n\n【解説】\nFSPは、顧客の購買履歴（トランザクションログ）をデータベース化し、LTV（顧客生涯価値）の高い「優良顧客（ヘビーユーザー）」を特定して、VIP専用のルーティング（特別割引やポイント）を提供するアーキテクチャです。パレートの法則（2:8の法則）に基づき、システム全体の収益に最も貢献する2割のアクティブユーザーを離脱させないための堅牢な設計思想です [cite: 450, 453]。"
    },
    {
        q: `【問題15 ダイナミック価格設定】
ダイナミック価格設定に関する記述として不適切なものは、次のうちどれか。

1. プロ野球の球団では、長年蓄積された顧客動向などのビッグ・データから、対象日程や席種、席数によって、価格を変動させ、集客を促進している。
2. ガソリンスタンドでは、仕入れ値や需給状況によって、1リットル当たりのガソリンの値段を変動させている。
3. 家電量販店では、商品の購入に際し、販売員と交渉しながら価格が調整され、売値が決定される。
4. スーパーマーケットでは、特定商品について他店に比べて極端な低価格設定をすることで商品を提供し続け、購入意欲を促進し、集客を狙う。
5. 電車のオフピーク定期券は、平日朝のピーク時間帯以外に限り使用できるもので、通常の定期券よりも格安で購入することができる。`,
        a: "4",
        exp: "正解は「4」です（これが不適切）。\n\n【解説】\nダイナミックプライシングは、需要と供給のトラフィックに応じて「リアルタイムに価格（リソース単価）を変動させる」仕組み（AWSのスポットインスタンスのようなもの）です。選択肢4は「常に極端な低価格で固定する」という静的（Static）な戦略であり、「ロスリーダー政策（目玉商品）」や「EDLP（Everyday Low Price）」と呼ばれる全く別のアプローチです。"
    },
    {
        q: `【問題16 市場浸透価格設定】
市場浸透価格設定によるマーケティング政策の説明として適切なものは、次のうちどれか。

1. 高額製品を好む層にターゲットを絞り、高めの価格を設定し、収益を確保しようとするもの。
2. 低所得層にターゲットを絞り、初期に安めの価格を設定することで、ターゲット内の市場シェアを確保するもの。
3. 価格を高めに設定し、プロモーションや人的販売で大々的に告知することで、市場での認知度を上げていこうとするもの。
4. ターゲットが購入する際に、製品の持つ機能や特長で比較して選択してもらうように、競合製品に合わせて価格を設定するもの。
5. 競合製品を寄せつけない上に、ターゲットに魅力的と感じてもらうような低価格を設定し、初期段階で市場を占有しようとするもの。`,
        a: "5",
        exp: "正解は「5」です。\n\n【解説】\n市場浸透価格設定（ペネトレーション・プライシング）は、リリース初期に意図的に利益を削って低価格で提供し、一気に巨大なユーザーベース（シェア）を獲得する戦略です。IT業界で言えば「フリーミアムモデル」や「初期無料キャンペーン」でネットワーク外部性を急速に高め、競合の参入（フォーク）を防ぐ強力なアーキテクチャです。"
    },
    {
        q: `【問題18 価格設定に関わる法律】
価格設定に関わる法律の記述として不適切なものは、次のうちどれか。

1. 独占禁止法は、公正かつ自由な競争を促進することによって、消費者の利益を確保することを目的にしている。
2. カルテルとは、企業同士がお互いの利益を守るために競争を制限し、協議して協定を結ぶことであり、価格カルテル、数量カルテル、販路制限カルテルなどがある。
3. 正当な理由がないのに、商品を著しく安い価格で継続的に販売することを不当廉売といい、不公正な取引方法に指定されている。
4. 競争制限的な企業結合とは、入札価格法において、入札前に受注者や受注金額を決めることであり、不正競争防止法で禁止されている。
5. 景品表示法における不当表示は、価格の不当な表示を規制するだけでなく、サービス品質に関する不当な表示にも及ぶ。`,
        a: "4",
        exp: "正解は「4」です（これが不適切）。\n\n【解説】\n入札前に事前に談合する行為（入札談合）を規制しているのは「独占禁止法（または刑法の談合罪）」です。「不正競争防止法」は、営業秘密の侵害やコピー商品の販売などを取り締まる法律です。どのセキュリティポリシー（法律）がどのインシデントに適用されるか、名前空間（管轄）の定義を間違えると致命的なコンプライアンス違反（バグ）となります。"
    },
    {
        q: `【問題19 組織間システム】
組織間システムに関する記述として適切なものは、次のうちどれか。

1. チャネルを構成するメンバーは、各自の個別目的と組織間システムとしての目的を必ず合致させる必要がある。
2. 組織間システムでは、チャネルを構成する各組織体（メンバー）はサブシステムとみなされ、固定的な役割を与えられ、変更することは許されない。
3. 組織間システムは、チャネルを構成する各組織体を最適化させるための設計・構築・管理がされている。
4. チャネル政策では、チャネル全体に目を向けて、組織間システム全体の最適化を目標とする必要がある。
5. 組織間システムは、クローズド・システムの一種である。`,
        a: "4",
        exp: "正解は「4」です。\n\n【解説】\n流通チャネル（メーカー→卸→小売）を1つの大きなシステムと捉える考え方です。重要なのは「局所最適（各企業の利益の最大化）」ではなく「全体最適（サプライチェーン全体のスループット向上）」を目指すことです。個別のマイクロサービス（各企業）が単独で最適化されても、システム全体のボトルネックが解消されなければ意味がない、というアーキテクチャの基本と同じです。"
    },
    {
        q: `【問題20 チェーン・オペレーション】
チェーン・オペレーションに関する記述として不適切なものは、次のうちどれか。

1. チェーン・オペレーションは、大量仕入れや統一プロモーションによる経営効率の向上を目的とする。
2. チェーン・オペレーションでの本部機能は、バイイング・パワーをいかに確保していくかが大切である。
3. ボランタリー・チェーンは、加盟店の資本的独立を維持したまま、規模のメリットを享受でき、強力な本部方針のもとに統一的な店舗運営が実現できる。
4. フランチャイズ・チェーンは、加盟店が本部企業にロイヤルティを支払うことによって組織化されるため、短期間で店舗数拡大が可能である。
5. レギュラー・チェーンは、本部と店舗が同じ資本であるケースが多いため、一体感が強く、仕入れ活動におけるバイイング・パワーが強い。`,
        a: "3",
        exp: "正解は「3」です（これが不適切）。\n\n【解説】\nボランタリー・チェーン（VC）は、独立した小売店が集まって共同仕入れなどを行う「緩やかなネットワーク（P2Pのような分散型）」です。そのため、フランチャイズ（FC）やレギュラーチェーン（RC）のような「強力な本部（中央集権サーバー）による統一的な管理」を強制することはできません。結合度が低い（疎結合である）ことがVCの特徴です。"
    },
    {
        q: `【問題34 プロモーション効果モデル】
プロモーション効果モデルの1つである「AISAS」において、（ ）に当てはまる用語として適切なものは、次のうちどれか。

A: Attention  I: Interest  S:（ ）  A: Action  S: Share

1. Scan
2. Survey
3. Split
4. Sympathize
5. Search`,
        a: "5",
        exp: "正解は「5」です。\n\n【解説】\nインターネット時代の消費者行動モデル「AISAS（アイサス）」の3つ目の「S」は「Search（検索）」です。ユーザーは興味（Interest）を持った後、すぐにアクション（購買）を起こすのではなく、必ず検索エンジンやSNSという「データベースに対してクエリを発行する（Search）」フェーズを挟みます。この検索トラフィックをいかに自社にルーティングさせるか（SEO等）が重要になります。"
    },
    {
        q: `【問題36 生成AIと広告】
生成AIを利用して広告表現物を作成する行為に関する記述として最も不適切なものは、次のうちどれか。

1. 生成AIを利用する場合でも、指示の内容によって回答の精度が変わってくるので、前提情報を与えたり、字数や回答項目を指定したりするなど、人間の関与が重要になる。
2. 生成AIを利用していても、そこに人間の「創作的寄与」があれば、生成された表現は著作権で保護される著作物になり得る。
3. 生成AIを利用した結果、既存の著作物と酷似するものが出力された場合には、著作権侵害になる可能性がある。
4. 生成AIは、どれも非営利目的の利用に限定されている。個人が趣味的に楽しむのはよいが、生成AIで作成した表現物を広告主に提案するのは違法行為になるので避けるべきである。
5. 生成AIを利用した場合、その生成物の内容に虚偽が含まれていることもあるので、必ずその根拠や裏付けを自ら確認する必要がある。`,
        a: "4",
        exp: "正解は「4」です（これが不適切）。\n\n【解説】\n生成AIのAPIやサービスが「全て非営利目的に限定されている」というのは事実誤認です。オープンソースライセンス（MITやApache等）に商用利用可のものがあるように、商用利用を前提として提供されているエンタープライズ向けの生成AIモデルは多数存在します。ただし、利用規約（TOS）の確認とハルシネーション（虚偽出力）のチェックは必須の例外処理です。"
    },
{
        q: `【問題2 事業の定義（マーケティング近視眼）】
レビットは、論文「マーケティング近視眼」において、「アメリカの鉄道会社が衰退したのは、自社の事業を『輸送事業』ではなく『鉄道事業』と規定したことにある」と述べた [cite: 738]。これを踏まえて事業の定義を考える記述として適切なものは、次のうちどれか [cite: 739]。

1. アメリカの鉄道会社が衰退した理由は、事業の定義を広く設定したことにある [cite: 740]。
2. 最先端技術を扱う事業では、「製品中心」で事業の定義を考えた方がよい [cite: 741]。
3. 事業の定義を「顧客中心」で考えることは、何のためにこの事業を行うのかという本来の目的を考える上で欠かせない [cite: 741]。
4. 鉄道会社は、通信事業者を競争相手として意識する必要はない [cite: 742]。
5. 事業の定義が戦略へつながるために、顧客、ニーズ、競合の3つの次元を考慮することが必要である [cite: 743]。`,
        a: "3",
        exp: "正解は「3」です。\n\n【解説】\nプログラミングにおける「ドメイン駆動設計（DDD）」と全く同じ思想です。自社のビジネス（ドメイン）を、手段である「製品・技術（ハードウェアや特定の言語）」で定義すると、技術の陳腐化とともにシステムがレガシー化します。常に「顧客が解決したい課題（ユーザー要件・インターフェース）」を中心に定義（抽象化）することで、環境変化に強いアーキテクチャになります [cite: 738, 741]。"
    },
    {
        q: `【問題5 MIS（マーケティング情報システム）】
マーケティング情報システムの構造とその特徴に関する記述として最も不適切なものは、次のうちどれか [cite: 769]。

1. 日常的な業務が遂行された結果、発生するデータから構成されるシステム [cite: 770]。
2. 変化するマーケティング環境を把握するため、日常業務場面で行う情報収集活動によって構成されるシステム [cite: 771]。
3. 特定課題に対する調査データ (一次データ)を保存し、類似課題に再利用するシステム [cite: 772]。
4. 各種情報を意思決定に有益な形に変換するためのモデルシステム [cite: 773]。
5. マーケティング担当者によるデータやモデルの利用状況を構成するシステムで、データがあれば自動的に高度な判断が可能なシステム [cite: 774]。`,
        a: "5",
        exp: "正解は「5」です（これが不適切）。\n\n【解説】\n情報システム（MIS）は意思決定を「支援」するツール（ダッシュボードやBIツール）にすぎません。データベースにログが蓄積されているだけで、システムが「自動的に高度な経営判断（ビジネスロジックの自律実行）」をしてくれるわけではありません [cite: 774]。最終的な意思決定（コミット）を行うのは、あくまで人間の経営者やマーケターです。"
    },
    {
        q: `【問題9 消費者行動モデル】
消費者行動モデル・理論・分析に関する記述として不適切なものは、次のうちどれか [cite: 808]。

1. 消費者行動の心理変化を5段階のプロセスにまとめたものを、「AIDMA理論」という [cite: 809]。
2. 3つの尺度から、消費者のライフスタイルや価値基準を分析する手法を「AIO分析」という [cite: 809]。
3. 「刺激一反応モデル」とは、内面ヘインプットされる「刺激」と、アウトプットされる「反応」との関係を分析する構造非明示型モデルのことである [cite: 810]。
4. ロジャースの「革新の普及理論」において、他の消費者の購買に強い影響を与え、オピニオンリーダーとなるのは、革新者 (イノベータ)である [cite: 810]。
5. 「認知的不協和の理論」とは、購買後に不協和が存在する場合、不協和な状態を「低減」、「回避」、又は「除去」する傾向があるとする理論のことである [cite: 811]。`,
        a: "4",
        exp: "正解は「4」です（これが不適切）。\n\n【解説】\nIT業界のオープンソース技術の普及を想像してください。「革新者（イノベーター）」は、実用性度外視でアルファ版に飛びつくマニアックな層であり、一般社会への影響力は持ちません [cite: 810]。市場全体に影響を与え、オピニオンリーダーとして機能する（メインストリームへの橋渡し役となる）のは、その次に採用する「初期採用者（アーリーアダプター）」です。"
    },
    {
        q: `【問題26 SCM（サプライチェーン・マネジメント）の導入目的】
アパレル大手A社は、サプライチェーン・マネジメントの導入によって生産から販売までの業務を効率化しようと計画している [cite: 989]。その導入の目的又は理由に関する記述として不適切なものは、次のうちどれか [cite: 989]。

1. 流通在庫を削減するため [cite: 990]。
2. 多くの製品のライフサイクルが短くなっているため [cite: 991]。
3. サプライチェーンにおける川下の需要変動が、川上に向かうほど増幅することがあるため [cite: 992]。
4. キャッシュ・フローを改善するため [cite: 993]。
5. 流通チャネルにおけるハロー効果を避けるため [cite: 994]。`,
        a: "5",
        exp: "正解は「5」です（これが不適切）。\n\n【解説】\n「ハロー効果」とは、ある対象を評価する際、目立ちやすい特徴に引きずられて他の評価も歪んでしまうという心理的バイアス（UI/UXのバグ）のことです [cite: 994]。SCMは、情報の遅延をなくし、在庫の無駄（メモリの滞留）やブルウィップ効果（川上に行くほど需要予測のブレが増幅するエラー）を防ぐための「パイプライン最適化」の仕組みであり、ハロー効果とは全く関係がありません [cite: 989, 992]。"
    },
    {
        q: `【問題34 プロモーション・ミックスの管理】
プロモーション・ミックスの管理に関する記述として適切なものは、次のうちどれか [cite: 1045, 1046]。

1. プロモーションの主なターゲットとして、消費者、販売業者、社内の三者が挙げられるが、販売業者がアプローチの最終目標となる [cite: 1047]。
2. ターゲットの特定とは換言すれば個別化であるが、集団的な設定の方が効率的に情報の到達ができる [cite: 1048]。
3. ターゲットにとって、プロモーション・メッセージに接するコンタクト・ポイントは固定的なので、それを観察することが重要となる [cite: 1049]。
4. プロモーションの効果を上げるには、単発のメディアにし、チャネルも限定した方がよい [cite: 1050]。
5. 顧客データベースを活用して、上位顧客に絞ったプロモーションを行うことができれば、より効率的に広告費を用いることができる [cite: 1051]。`,
        a: "5",
        exp: "正解は「5」です。\n\n【解説】\n◯ 5：CRM（顧客関係管理）の基本となるロジックです。データベースにクエリをかけてLTV（顧客生涯価値）の高い上位顧客を抽出し、そこにリソース（広告費）を集中投下することで、ROI（投資対効果）を劇的に高めることができます [cite: 1051]。\n✕ 1：最終目標は「消費者」です [cite: 1047]。\n✕ 4：複数のメディア・チャネルを組み合わせる（クロスメディア設計）ことで相乗効果が生まれます [cite: 1050]。"
    },
    {
        q: `【問題39 人的販売】
人的販売に関する記述として不適切なものは、次のうちどれか [cite: 1086]。

1. 双方向コミュニケーションである [cite: 1087]。
2. 顧客の不満や要望を把握する機会を獲得できる [cite: 1088]。
3. プル戦略の1つである [cite: 1089]。
4. 購買心理過程の最終段階での影響力が大きい [cite: 1090]。
5. 目的は所有権の移転である [cite: 1090]。`,

    },
    {
        q: `【問題3 ポジショニングの有効性】

    },
    {
        q: `【問題12 製品ライフサイクル】

    {

    },
    {
        q: `【問題27 3PL（サード・パーティー・ロジスティクス）】

    },
    {

    {

4. Web上の検索履歴や閲覧行動のデータを活用した行動ターゲティング広告は、近年多く利用されている広告手法である。
5. 企業は、インターネットを通じたリサーチ活動が消費者のプライバシーを侵害する可能性に十分な注意と配慮をする必要がある。`,
        a: 3,
        exp: "正解は「3」です（これが不適切）[cite: 6]。\n\n【解説】\nインターネット調査は「サンプリングバイアス（特定の属性への偏り）」という重大なバグを含みやすい手法です[cite: 6]。全てのユーザーが均等にネットを使いこなしているわけではないため、「あらゆる年齢層に完璧に適している」とするのは仕様の誤認です[cite: 6]。高齢者層などのデータが欠損（Null）になりやすい点に注意し、代替手法での補完（フォールバック）を検討する必要があります。"
    },
    {
        q: `【問題9 単純無作為抽出法】
単純無作為抽出法に関する記述として適切なものは、次のうちどれか。

1. 母集団の中から最初の調査対象者をランダムに選んで、後のサンプルは一定の抽出間隔を決めて選び出す方法である。
2. 母集団のサンプリング台帳からサンプルを1つずつランダムに抽出する方法である。
3. 調査者が性別、年齢、職業などの人口構成比率に応じて標本数を割り当てる方法である。
4. 母集団をあらかじめ等質なグループに分けておき、そのグループの大きさに比例してサンプルを抽出する方法である。
5. 標本抽出を何段階にもわたって行う方法で、母集団の数が多く、地域的にも広く散在する場合などに用いられる。`,
        a: 2,
        exp: "正解は「2」です[cite: 6]。\n\n【解説】\n◯ 2：乱数生成関数（`Math.random()`など）を使って、配列（母集団）から完全にランダムに要素をフェッチする最もピュアなアルゴリズムです[cite: 6]。\n✕ 1：系統抽出法（一定間隔のループ処理）[cite: 6]。\n✕ 3：割当抽出法（属性ごとの定数設定）[cite: 6]。\n✕ 4：層化抽出法（グループ分けしてからの比例抽出）[cite: 6]。\n✕ 5：多段抽出法（階層的な絞り込み）[cite: 6]。"
    },
    {
        q: `【問題10 消費者の購買行動】
消費者の購買行動に関する記述として適切なものは、次のうちどれか。

1. 消費者は、外部情報の探索で十分な満足の決定が下せないとき、内部情報の探索を行う。
2. 複雑な購買者の心的プロセスを階層に分けて可視化したものが、AIDAモデルである。
3. 消費者の購買行動は、合理的な購買行動に限定される。
4. 消費者行動には購買行動と消費行動が含まれ、購買に至るプロセスだけではなく購入後の消費行動の研究も重要である。
5. 消費者購買意思決定プロセスの代替案の評価の段階で浮かんでくる「想起セット」は、通常、かなり多くのブランドが想起され考慮される。`,
        a: 4,
        exp: "正解は「4」です[cite: 6]。\n\n【解説】\n◯ 4：消費者行動において、購買は「トランザクションの完了」で終わりではありません[cite: 6]。その後の消費（利用体験）や廃棄に至るまでの「ライフサイクル全体（オブジェクト生成からガベージコレクションまで）」をトラッキングすることが、LTV（顧客生涯価値）向上の要件となります[cite: 6]。\n✕ 1：順序が逆です。まずローカルキャッシュ（記憶）を検索し、ヒットしなければ外部API（検索・口コミ）を叩きます[cite: 6]。"
    },
    {
        q: `【問題11 組織購買行動】
組織購買行動と消費者購買行動の相違に関する記述として最も適切なものは、次のうちどれか。

5. 人的販売はあまり重要ではない。`,
        a: 4,
        exp: "正解は「4」です[cite: 6]。\n\n【解説】\nBtoB（企業間取引）などの組織購買は、個人の衝動買いとは異なり、稟議などの「複雑なワークフロー（集団意思決定）」を経て行われます[cite: 6]。また、導入後の保守運用やSLA（サービス品質保証）がビジネスに直結するため、購入後（ポストパーチェス）のアフターサポートやベンダーとの関係性維持が極めて重要視されます[cite: 6]。1,2,3,5はすべて消費者購買（BtoC）側の特徴です[cite: 6]。"
    },
    {
        q: `【問題12 新製品開発プロセス】
一般的な日用品の新製品開発のプロセスに関する記述として不適切なものは、次のうちどれか。

1. アイデア創出：社内・社外双方からアイデアを得る。
2. アイデア・スクリーニング：市場性、永続性、製造能力などの観点からアイデアをスクリーニングする。

5. 市場テスト：新製品の失敗リスクを減少させるためであり、短期間で情報が得られ、コストが安いことがメリットである。`,
        a: 5,
        exp: "正解は「5」です（これが不適切）[cite: 6]。\n\n【解説】\n市場テスト（テストマーケティング）は、本番環境（プロダクション）の一部に限定して実際に製品をリリースする「カナリアリリース」です[cite: 6]。リアルなデータが取れる反面、「期間がかかる」「コスト（インフラや運用費）が高い」「競合に新製品のソースコード（アイデア）をリバースエンジニアリングされるリスクがある」といった強烈なデメリット（トレードオフ）が存在します[cite: 6]。"
    },
    {
        q: `【問題13 製品ライフサイクル（成長期）】
製品ライフサイクルの「成長期」におけるマーケティング目的、目標、製品戦略及びブランディング戦略に関する記述として不適切なものは、次のうちどれか。

2. 製品戦略：新次元での製品差別化、製品アイテムの追加

4. ブランディング戦略：ブランド強化
5. マーケティング目的：市場浸透による拡大`,
        a: 5,
        exp: "正解は「5」です（これが不適切）[cite: 6]。\n\n【解説】\n製品ライフサイクルの「成長期」は、市場規模自体が急速に拡大しているフェーズです[cite: 6]。この時期の主な目的は、新しい顧客層を取り込む「市場開拓（パイ自体の拡大）」です[cite: 6]。「市場浸透（すでに成熟した既存市場でシェアを奪い合う、あるいは利用頻度を深掘りする）」は、成長が鈍化した「成熟期」に採られる最適化アプローチであり、フェーズが異なります[cite: 6]。"
    },
    {
        q: `【問題14 FSP戦略】
小売業のFSP (フリークエント・ショッパーズ・プログラム) 戦略として適切なものは、次のうちどれか。

1. 商品グレード別に価格を設定し、幅広い顧客グループに向けて商品をラインナップして提供する。
2. 一定の期間、意図的に特定の商品を大幅な値引き価格で提供する。
3. 上位の優良顧客を囲い込むために、認定した会員だけの特別価格などを提供する。
4. 特定の商品に対して、変動のない安い価格を設定し、提供し続ける。
5. ライバルの他店のチラシ持参により、他店よりも安い価格で同一商品を提供する。`,
        a: 3,
        exp: "正解は「3」です[cite: 6]。\n\n【解説】\nFSP（マイレージやポイントプログラム等）は、顧客の購買履歴（トランザクションログ）をデータベース化し、システム全体の収益に最も貢献する2割のアクティブユーザー（優良顧客）を特定するアーキテクチャです[cite: 6]。この上位層にVIP専用のルーティング（特別割引等）を提供し、離脱（チャーン）を防ぐ堅牢なCRM戦略です[cite: 6]。"
    },
    {
        q: `【問題15 ダイナミック価格設定】
ダイナミック価格設定に関する記述として不適切なものは、次のうちどれか。

1. プロ野球の球団では、長年蓄積されたビッグ・データから、対象日程や席種、席数によって価格を変動させている。
2. ガソリンスタンドでは、仕入れ値や需給状況によって値段を変動させている。
3. 家電量販店では、商品の購入に際し、販売員と交渉しながら価格が調整され、売値が決定される。
4. スーパーマーケットでは、特定商品について他店に比べて極端な低価格設定をすることで商品を提供し続け、集客を狙う。
5. 電車のオフピーク定期券は、平日朝のピーク時間帯以外に限り使用できるもので、通常の定期券よりも格安で購入できる。`,
        a: 4,
        exp: "正解は「4」です（これが不適切）[cite: 6]。\n\n【解説】\nダイナミックプライシングは、需要と供給のトラフィックに応じて「リアルタイムに価格（リソース単価）を変動させる」動的（Dynamic）な仕組みです[cite: 6]。選択肢4の「常に極端な低価格で提供し続ける」手法は、ロスリーダー（目玉商品）やEDLP（Everyday Low Price）と呼ばれる、値がハードコードされた静的（Static）な戦略です[cite: 6]。"
    },
    {
        q: `【問題16 市場浸透価格設定】
市場浸透価格設定によるマーケティング政策の説明として適切なものは、次のうちどれか。

1. 高額製品を好む層にターゲットを絞り、高めの価格を設定し、収益を確保しようとするもの。
2. 低所得層にターゲットを絞り、初期に安めの価格を設定することで、ターゲット内の市場シェアを確保するもの。
3. 価格を高めに設定し、プロモーションや人的販売で大々的に告知することで、市場での認知度を上げていこうとするもの。
4. ターゲットが購入する際に、機能や特長で比較して選択してもらうように、競合製品に合わせて価格を設定するもの。
5. 競合製品を寄せつけない上に、ターゲットに魅力的と感じてもらうような低価格を設定し、初期段階で市場を占有しようとするもの。`,
        a: 5,
        exp: "正解は「5」です[cite: 6]。\n\n【解説】\n市場浸透価格設定（ペネトレーション・プライシング）は、リリース初期に意図的に利益を削って低価格で提供し、一気に巨大なユーザーベースを獲得する戦略です[cite: 6]。IT業界の「フリーミアムモデル」のように、ネットワーク外部性を急速に高めることで、後発の競合が参入できないようにロックアウトする強力なアーキテクチャです[cite: 6]。"
    },// ▼▼▼ 令和5年度 後期 マーケティング2級（後半バッチ） ▼▼▼
    {
        q: `【問題20 チェーン・オペレーション】
チェーン・オペレーションに関する記述として不適切なものは、次のうちどれか。

1. チェーン・オペレーションは、大量仕入れや統一プロモーションによる経営効率の向上を目的とする。
2. チェーン・オペレーションでの本部機能は、バイイング・パワーをいかに確保していくかが大切である。
3. ボランタリー・チェーンは、加盟店の資本的独立を維持したまま、規模のメリットを享受でき、強力な本部方針のもとに統一的な店舗運営が実現できる。
4. フランチャイズ・チェーンは、加盟店が本部企業にロイヤルティを支払うことによって組織化されるため、短期間で店舗数拡大が可能である。
5. レギュラー・チェーンは、本部と店舗が同じ資本であるケースが多いため、一体感が強く、仕入れ活動におけるバイイング・パワーが強い。`,
        a: 2, // 選択肢3が正解(不適切)なのでインデックスは2
        exp: "正解は「3」です（これが不適切）[cite: 6]。\n\n【解説】\nボランタリー・チェーン（VC）は、独立した小売店が集まる「P2P（ピアツーピア）」のような緩やかな分散型ネットワークです[cite: 6]。そのため、フランチャイズ（FC）のような「強力な中央集権サーバー（本部）による画一的なコントロール」を強制することはできません[cite: 6]。各ノード（店舗）の独立性が高いのが特徴です。"
    },
    {
        q: `【問題23 物流とロジスティクス】
物流やロジスティクスに関する記述として適切なものは、次のうちどれか。

1. 配送コストを一定にした場合、高い顧客満足と少量の在庫水準を同時に達成することは容易である。
2. 効率性を重視すると、物流の世界ではトータルな視点からのロジスティクスを展開することが望ましいとされている。
3. リバース・ロジスティクスは、出荷間違いや下取り、商品の欠陥によって返品を受け取るロジスティクスのことであり、苦情による商品の返品は含まない。
4. 商流が小売段階での売上データを収集することであるのに対し、物流は、取引によって発生する商品の移動を指す。
5. 需要予測は外れることが多いので、物流やロジスティクスにおいては用いない方がよい。`,
        a: 1, 
        exp: "正解は「2」です[cite: 6]。\n\n【解説】\nロジスティクスは、単なる「配送」や「保管」といった個別モジュールの最適化（部分最適）ではなく、調達から消費に至るまでのサプライチェーン全体を一つのシステムとして捉え、アーキテクチャ全体のスループットを向上させる「全体最適」を目指す概念です[cite: 6]。"
    },
    {
        q: `【問題26 モーダルシフト】
環境に配慮した輸送手段変更(モーダルシフト) に関する記述として不適切なものは、次のうちどれか。

1. 一度に大量の荷物を輸送することによって、輸送にかかわる人員1人当たりの輸送量を高めることができる。
2. 宝石や貴金属のような単価の高い製品は、モーダルシフトの例が少ない。
3. 輸送手段の特性から二酸化炭素の排出量が少ないため、環境対策に効果的な施策の1つである。
4. 宅配便需要の急増等もあり、特に短距離輸送において検討される必要がある。
5. 物流事業者だけでなく荷主の理解が必要となり、全体的な輸送計画からアプローチしていくことが求められる。`,
        a: 3, 
        exp: "正解は「4」です（これが不適切）[cite: 6]。\n\n【解説】\nモーダルシフトとは、環境負荷を減らすために、トラック輸送から鉄道や船舶といった「大容量パイプライン（バッチ処理）」へアーキテクチャを移行することです[cite: 6]。鉄道や船は「長距離・大量輸送」に特化しているため、短距離のラストワンマイル通信（小回りの利くトラック）の代替としては機能しません[cite: 6]。"
    },
    {
        q: `【問題31 プロモーション・ミックス】
プロモーション・ミックスに関する記述として不適切なものは、次のうちどれか。

1. 消費財メーカーAは、若い女性をターゲットとしており、プル戦略の1つとしてSNSを活用したプロモーションを行った。
2. アパレルブランドBは、廃材を活用した新商品を開発し、メディアの取材を誘致するパブリシティ展開を行った。
3. 大手通信会社Cは、新料金プランを告知するため、テレビCMを活用した広告展開で大規模なプッシュ戦略を行った。
4. 家電メーカーDは、量販店における店頭キャンペーンを企画し、セールス・パーソンを派遣して人的販売を行った。
5. ITツール販売会社Eは、新規顧客獲得を目的とし、自社ツールの活用方法を伝えるオンライン・セミナーを企画して販売促進を行った。`,
        a: 2, 
        exp: "正解は「3」です（これが不適切）[cite: 6]。\n\n【解説】\nテレビCMは、不特定多数のエンドユーザーに向けてブロードキャスト通信を行い、ユーザー側から「欲しい」というリクエストを誘発させるための典型的な「プル戦略（Pull型アーキテクチャ）」です[cite: 6]。メーカーが流通業者に押し込む「プッシュ戦略（Push型）」ではありません[cite: 6]。"
    },
    {
        q: `【問題36 生成AIと広告】
生成AIを利用して広告表現物を作成する行為に関する記述として最も不適切なものは、次のうちどれか。

1. 生成AIを利用する場合でも、指示の内容によって回答の精度が変わってくるので、前提情報を与えたり、字数や回答項目を指定したりするなど、人間の関与が重要になる。
2. 生成AIを利用していても、そこに人間の「創作的寄与」があれば、生成された表現は著作権で保護される著作物になり得る。
3. 生成AIを利用した結果、既存の著作物と酷似するものが出力された場合には、著作権侵害になる可能性がある。
4. 生成AIは、どれも非営利目的の利用に限定されている。個人が趣味的に楽しむのはよいが、生成AIで作成した表現物を広告主に提案するのは違法行為になるので避けるべきである。
5. 生成AIを利用した場合、その生成物の内容に虚偽が含まれていることもあるので、必ずその根拠や裏付けを自ら確認する必要がある。`,
        a: 3, 
        exp: "正解は「4」です（これが不適切）[cite: 6]。\n\n【解説】\n生成AIのAPIやサービスが「全て非営利（NCライセンス等）」に限定されているわけではありません[cite: 6]。商用利用可能なエンタープライズモデル（Azure OpenAI等）も多数存在します。ただし、ハルシネーション（虚偽出力）のチェックなど、人間による例外処理（フォールバック）は必須です[cite: 6]。"
    },
    {
        q: `【問題40 パブリシティの特性】
「広告」と比較した場合、「パブリシティ」の特性として最も適切なものは、次のうちどれか。

1. 掲載内容の選択・決定権は広告主にある。
2. 情報特性は主観的である。

        a: 2, 
        exp: "正解は「3」です[cite: 6]。\n\n【解説】\nパブリシティは、プレスリリースなどを元にメディア（第三者）がニュースとして取り上げる手法です[cite: 6]。第三者の客観的な検証フィルターを通るため、自社で発信する広告よりもエンドユーザーからの「信頼性（トラスト）」が高いのが最大のメリットです[cite: 6]。ただし、メディア側にコントロール権があるため、計画的・同期的なデプロイは保証されません[cite: 6]。"

      // ▼▼▼ 令和5年度 後期 マーケティング2級（後半 完全版バッチ） ▼▼▼
    {
        q: `【問題18 価格設定に関わる法律】
価格設定に関わる法律の記述として不適切なものは、次のうちどれか。

1. 独占禁止法は、公正かつ自由な競争を促進することによって、消費者の利益を確保することを目的にしている。
2. カルテルとは、企業同士がお互いの利益を守るために競争を制限し、協議して協定を結ぶことであり、価格カルテル、数量カルテル、販路制限カルテルなどがある。
3. 正当な理由がないのに、商品を著しく安い価格で継続的に販売することを不当廉売といい、不公正な取引方法に指定されている。
4. 競争制限的な企業結合とは、入札価格法において、入札前に受注者や受注金額を決めることであり、不正競争防止法で禁止されている。
5. 景品表示法における不当表示は、価格の不当な表示を規制するだけでなく、サービス品質に関する不当な表示にも及ぶ。`,
        a: 4,
        exp: "正解は「4」です（これが不適切）[cite: 6]。\n\n【解説】\n入札前に事前に談合する行為（入札談合）を規制しているのは「独占禁止法（または刑法の談合罪）」です[cite: 6]。「不正競争防止法」は、営業秘密の侵害などを取り締まるルールであり、例外処理（適用される法律クラス）のルーティングミスです。"
    },
    {
        q: `【問題19 組織間システム】
組織間システムに関する記述として適切なものは、次のうちどれか。

1. チャネルを構成するメンバーは、各自の個別目的と組織間システムとしての目的を必ず合致させる必要がある。
2. 組織間システムでは、チャネルを構成する各組織体 (メンバー) はサブシステムとみなされ、固定的な役割を与えられ、変更することは許されない。
3. 組織間システムは、チャネルを構成する各組織体を最適化させるための設計・構築・管理がされている。
4. チャネル政策では、チャネル全体に目を向けて、組織間システム全体の最適化を目標とする必要がある。
5. 組織間システムは、クローズド・システムの一種である。`,
        a: 4,
        exp: "正解は「4」です[cite: 6]。\n\n【解説】\n流通チャネルを構成する各企業（マイクロサービス）の局所最適（各社の利益最大化）ではなく、チャネル全体のスループット向上（全体最適化）を目標として設計・管理するのが組織間システムのアーキテクチャ思想です[cite: 6]。"
    },
    {
        q: `【問題20 チェーン・オペレーション】
チェーン・オペレーションに関する記述として不適切なものは、次のうちどれか。

1. チェーン・オペレーションは、大量仕入れや統一プロモーションによる経営効率の向上を目的とする。

3. ボランタリー・チェーンは、加盟店の資本的独立を維持したまま、規模のメリットを享受でき、強力な本部方針のもとに統一的な店舗運営が実現できる。
4. フランチャイズ・チェーンは、加盟店が本部企業にロイヤルティを支払うことによって組織化されるため、短期間で店舗数拡大が可能である。
5. レギュラー・チェーンは、本部と店舗が同じ資本であるケースが多いため、一体感が強く、仕入れ活動におけるバイイング・パワーが強い。`,
        a: 3,
        exp: "正解は「3」です（これが不適切）[cite: 6]。\n\n【解説】\nボランタリー・チェーン（VC）は、独立した小売店が集まる「P2P」のような緩やかな分散型ネットワークです[cite: 6]。FCのように「強力な中央集権サーバー（本部）による画一的なコントロール」を強制することはできません[cite: 6]。"
    },
    {
        q: `【問題21 新規チャネル（子会社）設立のメリット】
既存のチャネルはそのままに、小規模な法人向け市場をターゲットとするA社製品の販売を目的とした子会社Y社を設立し、通信販売を行うこととなった。子会社Y社を設立することによって得られるメリットに関する記述として最も適切なものは、次のうちどれか。

1. 自社以外からの商品の調達が可能となる。

4. 流通の川下に進出することによって、製造コストを下げることが可能となる。
5. ダイレクトなコンタクトが容易になり、顧客との人間関係が深まる。`,
        a: 5,

    },
    {
        q: `【問題22 業界流通VAN】
業界流通VAN(特定の業界で利用されているEDIシステム) のメリットに関する記述として不適切なものは、次のうちどれか。

3. 複数の企業が参加し、共同で使用しているシステムのため、開発・運用コストがなく、業界流通VANに参加している企業は、無料でサービスを開始でき、費用負担はない。
4. セキュリティが高く、データ改ざんや破壊を防げる上に、通信速度が速く、企業間での通信もスムーズに行える。
5. 1つのシステムを用意するだけで、標準仕様の通信プロトコルやフォーマットを使用する全ての事業者と接続できる。`,
        a: 3,
        exp: "正解は「3」です（これが不適切）[cite: 6]。\n\n【解説】\n業界流通VANは標準プロトコル（API）を提供するSaaSインフラですが、システムである以上、サーバー代やトラフィック課金、保守開発費（開発・運用コスト）は必ず発生します[cite: 6]。「完全無料」で運用できるシステムはありません。"
    },
    {
        q: `【問題23 物流やロジスティクス】
物流やロジスティクスに関する記述として適切なものは、次のうちどれか。

2. 効率性を重視すると、物流の世界ではトータルな視点からのロジスティクスを展開することが望ましいとされている。
3. リバース・ロジスティクスは、出荷間違いや下取り、商品の欠陥によって返品を受け取るロジスティクスのことであり、苦情による商品の返品は含まない。

        a: 2,
        exp: "正解は「2」です[cite: 6]。\n\n【解説】\nロジスティクスは、単なる「配送モジュール」の部分最適化ではなく、調達から消費に至るまでのサプライチェーン全体を一つのシステムとして捉え、アーキテクチャ全体のスループット向上（全体最適）を目指す概念です[cite: 6]。"
    },
    {
        q: `【問題24 クリストファーのサービス要素】

        a: 2,
        exp: "正解は「2」です（これが不適切）[cite: 6]。\n\n【解説】\n「オーダー履行率（注文に対してどれだけ正確に納品できたか）」は、取引実行中（トランザクション中）に測定されるパフォーマンス指標であり、「取引前（Pre-transaction）」の要素ではありません[cite: 6]。ライフサイクルのフェーズ定義エラーです。"
    },
    {
        q: `【問題25 ロジスティクスの価値連鎖】

        a: 1,
        exp: "正解は「1」です（これが不適切）[cite: 6]。\n\n【解説】\n「商品の取引（所有権の移転）による価値の向上」は、ビジネスロジックを担う『商流』の役割です[cite: 6]。『物流（ロジスティクス）』は、必要なものを必要な時に届ける「時間と場所のユーティリティ（データ転送とルーティング）」を提供するインフラレイヤーです。"
    },
    {
        q: `【問題26 モーダルシフト】

2. 宝石や貴金属のような単価の高い製品は、モーダルシフトの例が少ない。
3. 輸送手段の特性から二酸化炭素の排出量が少ないため、環境対策に効果的な施策の1つである。
4. 宅配便需要の急増等もあり、特に短距離輸送において検討される必要がある。

    },
    {
        q: `【問題27 包装の区分】
包装の区分に関する記述として不適切なものは、次のうちどれか。

2. 輸送包装は、流通・物流業者によって行われるので商業包装と同義となることもある。
3. 消費者包装は、消費者の手元に渡るようにするために行う包装である。
4. 外装とは物品を箱や袋といった容器などに入れて結束させた包装のことである。
5. 取引の一部としたり、商品をまとめたりするために行われる包装を商業包装という。`,
        a: 2,
        exp: "正解は「2」です（これが不適切）[cite: 6]。\n\n【解説】\n「輸送包装」は物流のための堅牢なパッケージングであり「工業包装」と同義です[cite: 6]。「商業包装」は、店頭で消費者にアピールするため（フロントエンドのUI）の包装であり、目的（インターフェースの役割）が全く異なります[cite: 6]。"
    },
    {
        q: `【問題28 パッケージ・デザインのプロセス】
パッケージ・デザインの市場導入のプロセスに関する記述として最も適切なものは、次のうちどれか。

1. 濫用テストとは、パッケージのプロモーションでの認知度を判断するものである。
2. トータル・システム開発では、生産部門を除き、パッケージ開発のための調整を行う。
3. パッケージ開発行路には、パッケージの技術的・機能的要件の定義や開発にかかわるコストの積算が含まれる。
4. 部門間の調整を行うと消費者の目を引くデザインにならないので、消費者に訴える美的感覚をもったデザイナーの意見に従う必要がある。
5. パッケージの開発では、製品開発に限定する必要があり、宗教や民族といったデモグラフィック要因は関係ない。`,
        a: 3,
        exp: "正解は「3」です[cite: 6]。\n\n【解説】\nパッケージ（外装モジュール）の開発においては、ソフトウェア開発と同様に「技術的・機能的要件の定義」と「工数見積もり（コスト積算）」が必須のプロセスとなります[cite: 6]。単なるUIデザインだけでなく、要件に基づく堅牢な実装が求められます。"
    },
    {
        q: `【問題29 再包装】
再包装に関する記述として不適切なものは、次のうちどれか。

4. 再包装の目的の1つとなる共通デザイン・パッケージングは、ブランド政策の一部となっている。

        a: 1,
        exp: "正解は「1」です（これが不適切）[cite: 6]。\n\n【解説】\n再包装（小売側で小分けにする等のリパッケージ）は、手間と資材がかかるため「コストの合理化（リソース削減）」には逆行します[cite: 6]。主な目的は、顧客の利便性向上や店舗独自の価値提供（UXの向上）です[cite: 6]。"
    },
    {
        q: `【問題30 ラベル表示に関する法律】
ラベルに関する記述として不適切なものは、次のうちどれか。

2. 等級ラベルは、文字、数字、言葉等によって、品質を識別するために設定されるものである。
3. ブランド・ラベルは、単にパッケージにブランドを付与したものであり、一部のアパレルや農作物で見られる。

        a: 1,
        exp: "正解は「1」です（これが不適切）[cite: 6]。\n\n【解説】\n商品ラベルにおける虚偽・誤認表示（BtoCの欺瞞的UI）を直接的に取り締まるのは「景品表示法」です[cite: 6]。「不正競争防止法」は競合他社間のフェアプレイ（BtoB）を規定するルールであり、バリデーションの管轄（ミドルウェア）が異なります。"
    },
    {
        q: `【問題32 プロモーション・ミックスの実施】

4. 製品ライフサイクルのステージの設定
5. プロモーション・ミックス予算の設定`,
        a: 3,
        exp: "正解は「3」です[cite: 6]。\n\n【解説】\n多様化社会において最も重要なのは「誰に・どこで伝えるか（ターゲットとオーディエンスの設定）」です[cite: 6]。システム開発において、エンドユーザー（ペルソナ）の要件定義が全てのアーキテクチャ設計の起点になるのと同じです。"
    },
    {
        q: `【問題33 プロモーション予算の設定】
プロモーション予算の設定に関する記述として適切なものは、次のうちどれか。

1. 売上高比率法は、実際にはあまり採用されていない。
2. 利益額に対する比率を基準に算定する「利益比率法」は、利益予想の困難さを考えると、正確さに欠ける面がある。
3. 有力な競合企業のプロモーション費用を基準に、これに対抗できる予算を設定するのが「競合対抗法」だが、基礎になる政策の違いも換算しやすく便利である。
4. 企業の状況から判断して支払可能な予算設定を図る「支出可能額法」は、経営者の判断が入る余地が小さく、透明性も高い。
5. プロモーション目標の達成に必要なタスクをブレイクダウンして、おのおのの予算を積み上げる方式が「目標課業達成法」だが、合理性の点で他の設定法より劣る。`,
        a: 2,
        exp: "正解は「2」です[cite: 6]。\n\n【解説】\n「利益比率法」は、まだ確定していない未来の利益（不確実な変数）をベースにするため、正確さに欠けるというバグを含みやすい設計です[cite: 6]。なお、選択肢5の「目標課業達成法（必要なタスクからのボトムアップ見積もり）」が最も合理的（劣らない）とされています[cite: 6]。"
    },
    {
        q: `【問題34 プロモーション効果モデル（AISAS）】
プロモーション効果モデルの1つである「AISAS」において、( )に当てはまる用語として適切なものは、次のうちどれか。

A: Attention  I: Interest  S:( )  A: Action  S: Share

2. Survey
3. Split
4. Sympathize
5. Search`,
        a: 5,

    },
    {
        q: `【問題36 生成AIと広告】
生成AIを利用して広告表現物を作成する行為に関する記述として最も不適切なものは、次のうちどれか。

5. 導入期には、マス・メディアを使った広告を投入し、明確なポジションを確立しなくてはならない。`,
        a: 0,
        exp: "正解は「1」です[cite: 7]。\n\n【解説】\n通信プロトコルの設計と同じです[cite: 7]。ターゲットが限定的で狭い市場（BtoBなど）であれば、1対1のコネクションを確立する「人的販売（TCP通信）」が効率的です[cite: 7]。全国の一般消費者など広い市場であれば、不特定多数に一斉送信する「マス広告（UDPブロードキャスト）」が最適なアーキテクチャとなります[cite: 7]。"
    },
    {
        q: `【問題34 プロモーション予算の設定】
プロモーション・ミックスの効率的な実施と管理には最適なプロモーション予算の設定が重要である。最も合理的とされている予算設定方式は、次のうちどれか。

1. 売上高比率法
2. 利益比率法
3. 競合対抗法
4. 支出可能額法
5. 目標課業達成法`,
        a: 4,
        exp: "正解は「5」です[cite: 7]。\n\n【解説】\n「目標課業達成法」は、達成したいKPI（目標）を定義し、それに必要なタスク（課業）を洗い出して、それぞれのコストを積み上げる方式です[cite: 7]。アジャイル開発におけるストーリーポイントのボトムアップ見積もりに似た、最も論理的で合理的な手法です[cite: 7]。"
    },
    {
        q: `【問題35 ロゴマークの公募と権利】
公益性の高い企業が、公共的な要素を多分に含むサービスを新規に行うに際し、その名称とロゴマークのデザインを一般公募することとなった。その際の記述として最も適切なものは、次のうちどれか。

1. 公共的な要素を多分に含むことから、一般の者は登録することができないため、商標権の問題は無関係である。
2. 最終決定されたものでなければ登録できず、第一次選考に残った候補だけ事前に商標出願しておくことなど不可能である。
3. 図形商標という観点から調査をすれば、著作権の面でも同じ判断をしてよい。
4. 同じデザインのロゴが見つかった場合、あくまでも偶然であって明らかに知る由もなければ、著作権侵害にはならない。
5. 公益性や公共性という見地から、応募された名称とロゴマークの権利は自動的に当該企業に帰属することとなる。`,
        a: 3,
        exp: "正解は「4」です[cite: 7]。\n\n【解説】\n著作権の侵害が成立するには「既存の作品に依拠した（ソースコードをコピーして参考にした）」という条件が必要です[cite: 7]。他人のコードを一切見ずに、偶然全く同じアルゴリズムを書いてしまった場合、著作権侵害にはなりません[cite: 7]。（※ただし、特許や商標は偶然の一致でも侵害になるため、区別が必要です）"
    },
    {
        q: `【問題37 広告表示の規制】
広告表示の規制に関する記述として最も不適切なものは、次のうちどれか。

1. 広告表示に関する法規制は、媒体特性によって異なるのが当然である。したがって、テレビと新聞における規制内容は異なる。
2. テレビ局が原則として、同業種の広告主を同じ番組内の広告枠に入れないのは、法規制に基づくものではなく、営業的配慮によるものである。
3. テレビ局が原則として、同一CM内に、他の企業名もしくはその商品・サービスが含まれないようにと求める根拠は、日本民間放送連盟の放送基準に明記されている。
4. インターネット上の物品販売サイトには、ネット上でのコミュニケーションに不当景品類及び不当表示防止法が及ばないことから、根拠のない最大級表現等があふれている。
5. 広告表示は不当景品類及び不当表示防止法で規制されるが、同法を現在所管する官庁は、消費者庁である。`,
        a: 3,
        exp: "正解は「4」です（これが不適切）[cite: 7]。\n\n【解説】\n「インターネット空間には景品表示法（景表法）のルールが適用されない」というのは、致命的なコンプライアンスのバグ（誤認識）です[cite: 7]。景表法は、紙媒体、電波媒体、インターネット（アフィリエイトやステマ含む）を問わず、すべてのフロントエンド表示に対して厳格に適用されます[cite: 7]。"
    },
    {
        q: `【問題38 公正取引委員会の役割】
公正取引委員会の役割に関する記述として不適切なものは、次のうちどれか。

1. 独占禁止法を運用するために設置された機関で、独占禁止法の補完法である下請法の運用も行っている。
2. 独占的大企業による市場支配を取り締まるのが役割なので、中小企業が不当廉売をしても、それは独占禁止法の範囲外のことになる。
3. 国の行政組織上は内閣府の外局として位置づけられている。
4. 「排除措置命令」を出して違反行為を除くための必要な措置を取るだけでなく、違反事業者に対して課徴金を課すことができる。
5. 独占禁止法によって、入札談合についても公共の利益を損なう不正な取引として禁止している。`,
        a: 1,
        exp: "正解は「2」です（これが不適切）[cite: 7]。\n\n【解説】\n公正取引委員会は、市場全体というOSの健全性を監視するセキュリティ機関です[cite: 7]。不当廉売（ダンピング）は、市場の競争環境を破壊する悪意のある攻撃とみなされます[cite: 7]。したがって、実行元が大企業（エンタープライズ）であろうと、中小企業（軽量プロセス）であろうと、例外処理（スルー）の対象にはならず、厳しく監視されます[cite: 7]。"
    },
    {
        q: `【問題39 販売店支援（事例）】
家電メーカーA社では、新製品の発売に合わせて、取扱いをしている全国の家電量販店400店舗に対する販売支援の一環として、大々的に新製品を顧客にアピールしたいという目的で、一斉展開するキャンペーンを検討している。この記述として最も適切なものはどれか。

1. 階層別のマネジャー研修を企画し、家電量販店のヨコのつながりを強化する目的で、参加希望者を募った。
2. キャンペーンの趣旨や実施マニュアルを企画資料として作成し、家電量販店の各社の社長に郵送した。
3. ラウンダーを配し、各店舗責任者とキャンペーンの売場の交渉を行うとともに、販促物などの売場演出を支援した。
4. 新製品の販売促進のためにチラシや販促物を家電量販店の社長あてに送付した。
5. 新製品についての顧客からの質問を想定した問答や対応トークをFAQとしてまとめ、希望者に配布した。`,
        a: 2,
        exp: "正解は「3」です[cite: 7]。\n\n【解説】\nキャンペーンを成功させるには、単に仕様書（マニュアルやチラシ）を経営陣にデプロイして終わるのではなく、実際に稼働している現場ノード（店舗）に出向き、ラウンダー（フィールドサポート）が直接インテグレーション（売場作りや交渉）を支援する泥臭いアクティブサポートが不可欠です[cite: 7]。"
    },
    {
        q: `【問題40 ステルスマーケティング規制】
ステルスマーケティング (ステマ) 規制に関する記述として不適切なものは、次のうちどれか。

1. ステマ規制の対象となるのは、商品・サービスを供給する事業者 (広告主)であり、企業からの広告依頼を受けたインフルエンサーやその他の第三者は対象外となる。
2. 事業者が第三者に対して明示的に依頼や指示をしていなければ、ステマ規制の対象になることはない。
3. 事業者の協力を得て制作されるものであっても、正常な商慣習における取材活動に基づく記事の配信、書評の掲載、番組放送であれば、ステマ規制の対象にならない。
4. ステマ規制は、インターネットだけでなく、テレビ、新聞、ラジオ、雑誌などのメディアにも適用される。ただし、明確に広告であるとわかるもの、例えばテレビCMは対象外である。
5. 消費者庁の調査の結果、違反行為が認められた場合、事業者に対して、措置命令が行われることがある。`,
        a: 1,
        exp: "正解は「2」です（これが不適切）[cite: 7]。\n\n【解説】\nステマ規制（景品表示法違反）は、明示的なメソッド呼び出し（直接的な契約や指示）がなくても発火（適用）します[cite: 7]。インフルエンサーへの高額なギフト提供など、客観的に見て「広告主が投稿内容をコントロールできる依存関係（Dependency）」があるにもかかわらず、その関係性をユーザーのUI上で隠蔽する行為は、コンプライアンス違反となります[cite: 7]。"
    },
    // ▲▲▲ 令和6年度 前期 マーケティング2級（後半 完全版バッチ） ここまで ▲▲▲
     // ▼▼▼ 令和7年度 前期 マーケティング2級（前半完全バッチ） ▼▼▼
    {
        q: `【問題1 企業レベルの目標】
事例：日本の自転車部品メーカーA社は、自転車を楽しむ文化の創造をコンセプトに、全利害関係者に継続的な価値をもたらすビジネスモデルを構築。競技大会のスポンサーやイベントを通じニーズを読み取り、革新的な部品を提供している。
A社が目指す企業レベルの目標に関する記述として最も適切なものは、次のうちどれか。

1. 世界をリードする性能と品質を兼ね備えた自転車の部品を開発・販売することを目指している。
2. 世界各地で開催される自転車競技大会をバックアップし、自社独自のイベントを開催することにより、知名度の向上を目指している。
3. 自転車ユーザーのアンケート調査により、ニーズを読み取り、技術革新や独自製品の開発につなげることを目指している。
4. 市場ニーズをきめ細かく読み取るビジネスモデルを開発することで、完成車メーカーよりも市場をリードすることを目指している。
5. 自転車のユーザー、メーカー、販売店などと協力して、自転車を楽しむ文化の創造をビジネスの世界で実現することを目指している。`,
        a: 5,
        exp: "正解は「5」です[cite: 8]。\n\n【解説】\nA社は単なる部品（ハードウェアモジュール）の提供にとどまらず、利害関係者（全ノード）を巻き込んだエコシステム（文化の創造）の構築を最上位のミッション（企業レベルの目標）として定義しています[cite: 8]。これは、OSベンダーが開発者とユーザーを巻き込んでプラットフォーム全体を成長させるアーキテクチャと同じ思想です。"
    },
    {
        q: `【問題2 事業の定義の考え方】
事業の定義の考え方に関する記述として不適切なものは、次のうちどれか。

1. 「我々の事業は何か」との問いは、企業が提供する商品によって満たされる顧客の欲求を基に定義される。
2. 「顧客は誰か」を考えることは重要である。直接取引を行う企業のみを顧客として捉えるのではなく、最終形態商品の購入者又は利用者も顧客と捉える。
3. 高級腕時計メーカーの競合は、同業他社だけではなく、自動車メーカーも競合となり得る。
4. 「我々の事業は何か」ということを真剣に問うべきは、事業が苦境に陥った時であり、成功している時に問うことは控える。
5. 自社及び他社によるイノベーションは、事業を再定義するきっかけになる。`,
        a: 4,
        exp: "正解は「4」です（これが不適切）[cite: 8]。\n\n【解説】\n「事業の定義（ドメイン定義）」はシステムのルートディレクトリ設計のようなものです[cite: 8]。事業が成功している（スケーリングしている）時こそ、環境の変化に合わせてドメインを再定義（リファクタリング）し、次のイノベーションの土台を作る必要があります[cite: 8]。「苦境に陥ってから考える」のでは、技術的負債が溜まりすぎて手遅れになります。"
    },
    {
        q: `【問題3 有効な標的市場を選定する基準】
有効な標的市場を選定する基準とその説明の組合せとして最も不適切なものは、次のうちどれか。

1. 測定可能性：選定されたセグメントの規模と特徴が明確な基準で測定可能であること。
2. 実質性：選定されたセグメントが当初から高い利益水準を実質的に保証されること。
3. 到達可能性：選定されたセグメントに対してマーケティング・ミックスに含まれる諸手段が到達し得ること。
4. 実行可能性：選定されたセグメントに対してマーケティング戦略を遂行できること。
5. 安定性：選定されたセグメントが投資コストを回収し、利益を上げ得る寿命の長さを有していること。`,
        a: 2,
        exp: "正解は「2」です（これが不適切）[cite: 8]。\n\n【解説】\nマーケティングの「実質性（Substantiality）」とは、その市場が「投資に見合うだけの十分な規模（トラフィック）を持っているか」を指します[cite: 8]。ビジネスにおいて「当初から高い利益が保証される」というチート（バグなしの完全保証）は存在しません[cite: 8]。"
    },
    {
        q: `【問題4 シェア型書店のマーケティング活動】
事例：「みんな書店」は一般の人が本棚を借りて販売するシェア型書店。店主A氏は「街の中に本との出会いで人との出会いをつくる」というコンセプトを掲げ、おしゃべり自由、本棚オーナー対話会などを開催。新聞の取材で「自分の考え及びやり方を出さないようにしている」と語った。
この活動に関する記述として不適切なものはどれか。

1. シェア型書店では、複数の顧客自身が売手になるという発想が、既存の店舗にはないポジショニングとなっている。
2. おしゃべり自由や本棚オーナーのお店番は、人と人の出会いを創発する基盤となる取組である。
3. 本棚オーナー対話会は、運営についての革新活動を担っている。
4. シェア型書店では、書店の店主が考えるコンセプトによって、本の販売は手段であり目的とはならない。
5. 店主A氏は、本棚オーナー数が伸び悩んでも、コンセプトに共感した方だけをオーナーにする方針を堅持する。`,
        a: 5,
        exp: "正解は「5」です（これが不適切）[cite: 8]。\n\n【解説】\n事例文で店主A氏は「自分の考え及びやり方を出さないようにしている（中央集権的なコントロールを避ける）」と明言しています[cite: 8]。それにもかかわらず、「自分のコンセプトに共感した方だけに絞り込む（厳格なアクセス制御をかける）」というのは、プラットフォームのオープンな運用方針と矛盾（ロジックエラー）しています[cite: 8]。"
    },
    {
        q: `【問題5 マーケティング活動と目的の組合せ】
個人及び法人向けモバイル端末セキュリティーソフトメーカーの<マーケティング活動>とその<目的>の組合せとして不適切なものは、次のうちどれか。

1. 関連業界の展示会への出展：顧客づくり
2. 自動継続サービス：顧客つなぎ
3. 開発者による裏技活用講座：顧客づくり
4. 新たな脅威に対する追加機能：顧客つなぎ
5. 24時間体制で緊急対応：顧客つなぎ`,
        a: 3,
        exp: "正解は「3」です（これが不適切）[cite: 8]。\n\n【解説】\n「裏技活用講座」のようなアドバンスドなチュートリアルは、すでに自社ソフトを導入している既存ユーザー向けのサポート（カスタマーサクセス）です[cite: 8]。これはチャーン（解約）を防ぎLTVを高めるための「顧客つなぎ（Retention）」の施策であり、新規獲得（Acquisition = 顧客づくり）ではありません[cite: 8]。"
    },
    {
        q: `【問題6 コスト・リーダーシップ戦略】
ポーターの3つの基本戦略の一つである「コスト・リーダーシップ戦略」で企業が取り得る選択肢として不適切なものは、次のうちどれか。

1. 操業率を高める。
2. スケールメリットを狙う。
3. アフターサービスの体制を構築する。
4. チャネルの垂直統合を実施する。
5. 経験効果を利用する。`,
        a: 3,
        exp: "正解は「3」です（これが不適切）[cite: 8]。\n\n【解説】\n「手厚いアフターサービスの構築」は、コスト削減ではなく、付加価値を提供して高く売るための「差別化戦略（プレミアム機能の追加）」です[cite: 8]。コスト・リーダーシップは、徹底的なリファクタリングやインフラの最適化（スケールメリットや経験効果）によって「業界最安値」を叩き出すための戦略です[cite: 8]。"
    },
    {
        q: `【問題8 分析手法（コンジョイント分析）】
マーケティング分析手法の中で、商品やサービスの「どのような属性」を「どの程度」変更すれば、消費者に気に入ってもらえるのかを明らかにする新製品開発戦略支援のための手法として最も適切なものは、次のうちどれか。

1. クラスター分析
2. 因子分析
3. コンジョイント分析
4. 共分散分析
5. コレスポンデンス分析`,
        a: 3,
        exp: "正解は「3」です[cite: 8]。\n\n【解説】\nコンジョイント分析は、製品の様々なスペック（価格、色、機能などのパラメータ）を組み合わせた仮想のプロファイルをユーザーに提示し、どの属性がどれくらい効いているか（効用値）を多変量解析するアルゴリズムです[cite: 8]。UI/UXのA/Bテストを多次元に拡張したようなシミュレーション手法です。"
    },
    {
        q: `【問題9 分析手法（クラスター分析）】
事例：スマートフォンの新規参入を目指すA社は、使用者ニーズのパターンとそれに対応した層を抽出するため多変量解析を実施。「日常使用機能重視」「娯楽機能重視」「情報取得機能重視」という3つのターゲット・グループが抽出された。
ターゲット・グループ抽出に用いた分析手法として適切なものはどれか。

1. 回帰分析
2. 主成分分析
3. 分散分析
4. 判別分析
5. クラスター分析`,
        a: 5,
        exp: "正解は「5」です[cite: 8]。\n\n【解説】\n大量のユーザーデータ（レコード）の中から、似たような特徴を持つユーザー同士を自動的にグループ分け（グルーピング）する手法を「クラスター分析」と呼びます[cite: 8]。機械学習における「教師なし学習（K-means法など）」の代表的なアルゴリズムであり、セグメンテーションの特定に利用されます[cite: 8]。"
    },

    {

    },
    {

    {

    {
        q: `【問題29 パッケージのテスト調査】

    {

    {

    {

    // 推し画像のリスト（10問ごとのご褒美）
    const oshiImages = [
        "https://ogre.natalie.mu/media/news/music/2025/1202/kikkoman_sukiyaki_meguro_1.jpg?imwidth=1280&imdensity=1",
        "https://ogre.natalie.mu/media/news/music/2025/1201/afternoontea_attakatumbler_Keyvisual.jpg?imwidth=1280&imdensity=1",
        "https://ogre.natalie.mu/media/news/music/2025/1124/anan2474.jpg?imwidth=400&imdensity=1",
        "https://ogre.natalie.mu/media/news/music/2025/1124/anan2474_SP.jpg?imwidth=400&imdensity=1",
        "https://ogre.natalie.mu/media/news/music/2025/1122/ATZ_3854.jpg?imwidth=1460&imdensity=1&impolicy=hq",
        "https://ogre.natalie.mu/media/news/music/2025/1120/ATZ_3752.jpg?imwidth=400&imdensity=1",
        "https://ogre.natalie.mu/media/news/music/2025/1104/DSC_0510.jpg?imwidth=1460&imdensity=1&impolicy=hq",
        "https://ogre.natalie.mu/media/news/music/2025/1026/4s41_025_01.jpg?imwidth=1280&imdensity=1"
    ];

    // 配列操作関数
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // 問題文のパース（テキスト形式への対応）
    function parseQuestion(qData) {
        // もしすでに数値のaなら、indexに直す(1始まり->0始まり)
        let ansIdx = (typeof qData.a === 'number') ? qData.a - 1 : parseInt(qData.a) - 1;

        // 改行で選択肢が分かれている形式の場合の処理
        // (JSON形式で記述されている場合はそのまま利用)
        let options = ["1", "2", "3", "4", "5"]; // デフォルト
        let text = qData.q;

        // 問題文中に選択肢が含まれている場合の簡易パース（これまでの形式対応）
        if(qData.q.includes("1.")){
             const parts = qData.q.split(/\n\n1\./); 
             if(parts.length > 1){
                 text = parts[0];
                 const optionsText = "1." + parts[1];
                 const tempOpts = optionsText.split(/\n/).map(o => o.replace(/^\d+\.\s*/, '').trim()).filter(o => o);
                 if(tempOpts.length >= 2) options = tempOpts;
             }
        }
        
        return { text: text, options: options, answerIdx: ansIdx, exp: qData.exp };
    }

    function startQuiz() {
        if(allQuestions.length === 0) { alert("問題データがありません！"); return; }
        currentQuestions = shuffleArray([...allQuestions]);
        currentIndex = 0;
        score = 0;
        sessionAnswerCount = 0;
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'none';
        document.getElementById('quiz-screen').style.display = 'flex';
        loadQuestion();
    }

    function loadQuestion() {
        isAnswering = true;
        const qData = currentQuestions[currentIndex];
        const parsed = parseQuestion(qData);
        
        document.getElementById('progress-text').textContent = `Q${currentIndex + 1} / ${currentQuestions.length}`;
        document.getElementById('score-text').textContent = `Score: ${score}`;
        document.getElementById('question-text').textContent = parsed.text;
        
        const optionsContainer = document.getElementById('options-container');
        optionsContainer.innerHTML = '';

        parsed.options.forEach((optText, i) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = optText;
            // 重要：クリック時に正解番号(parsed.answerIdx)と、選んだ番号(i)を渡す
            btn.onclick = () => checkAnswer(i, parsed.answerIdx, btn);
            optionsContainer.appendChild(btn);
        });

        // 解説エリアと「次へ」ボタンを隠す
        document.getElementById('explanation').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    // --- 修正版 checkAnswer ---
    function checkAnswer(selectedIdx, correctIdx, btnElement) {
        if (!isAnswering) return; // 連打防止
        isAnswering = false;

        const statusText = document.getElementById('result-status');
        const explanationText = document.getElementById('explanation-content');
        const explanationArea = document.getElementById('explanation');
        const nextBtn = document.getElementById('next-btn');
        
        // 正誤判定
        if (selectedIdx === correctIdx) {
            statusText.textContent = "正解！🎉";
            statusText.style.color = "var(--correct)";
            btnElement.classList.add('correct');
            score++; // スコア加算
            document.getElementById('score-text').textContent = `Score: ${score}`;
        } else {
            statusText.textContent = "残念...不正解 💦";
            statusText.style.color = "var(--wrong)";
            btnElement.classList.add('wrong');
            
            // 正解のボタンを強調表示
            const allBtns = document.querySelectorAll('.option-btn');
            if(allBtns[correctIdx]) {
                allBtns[correctIdx].classList.add('correct');
            }
        }
        
        // すべてのボタンを無効化
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(btn => btn.classList.add('disabled'));

        // 解説表示
        const currentQ = currentQuestions[currentIndex];
        explanationText.innerText = currentQ.exp; 
        explanationArea.style.display = 'block';
        nextBtn.style.display = 'block'; // 次へボタンを表示

        // 10問ごとのご褒美ロジック
        sessionAnswerCount++;
        if (sessionAnswerCount > 0 && sessionAnswerCount % 10 === 0) {
            setTimeout(() => {
                showReward();
            }, 800); 
        }
    }

    // ご褒美モーダル関連
    function showReward() {
        const modal = document.getElementById('reward-modal');
        const img = document.getElementById('reward-img');
        const randomImg = oshiImages[Math.floor(Math.random() * oshiImages.length)];
        img.src = randomImg;
        modal.style.display = 'flex';
    }

    function closeReward() {
        document.getElementById('reward-modal').style.display = 'none';
    }

    function nextQuestion() {
        currentIndex++;
        if (currentIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    function showResult() {
        document.getElementById('quiz-screen').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        
        const finalScore = document.getElementById('final-score');
        finalScore.textContent = `${score}`;
        
        const feedback = document.getElementById('feedback-message');
        const rankTitle = document.getElementById('rank-title');
        const resultImg = document.getElementById('result-image');
        
        const percent = (score / currentQuestions.length) * 100;
        
        if (percent >= 95) {
            rankTitle.textContent = "Rank SS : 神レベル！";
            feedback.textContent = "完璧です！世界一かっこいい！";
            resultImg.style.backgroundImage = `url('${idolConfig.result.rank5}')`;
        } else if (percent >= 85) {
            rankTitle.textContent = "Rank S : 最高！";
            feedback.textContent = "その調子！合格間違いなしだね！";
            resultImg.style.backgroundImage = `url('${idolConfig.result.rank4}')`;
        } else if (percent >= 70) {
            rankTitle.textContent = "Rank A : すごい！";
            feedback.textContent = "合格圏内！あとちょっとで完璧！";
            resultImg.style.backgroundImage = `url('${idolConfig.result.rank3}')`;
        } else if (percent >= 50) {
            rankTitle.textContent = "Rank B : 頑張った！";
            feedback.textContent = "基礎はOK！苦手なところを見直そう。";
            resultImg.style.backgroundImage = `url('${idolConfig.result.rank2}')`;
        } else {
            rankTitle.textContent = "Rank C : まだまだ伸びる！";
            feedback.textContent = "諦めないで！私が応援してるよ！";
            resultImg.style.backgroundImage = `url('${idolConfig.result.rank1}')`;
        }
    }
</script>
